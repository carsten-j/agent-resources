name: Validate Agent files

on:
  push:
    paths:
      - '.claude/agents/*.md'
      - 'agent_validator.py'
      - '.github/workflows/validate-agents.yml'
  pull_request:
    paths:
      - '.claude/agents/*.md'
      - 'agent_validator.py'
      - '.github/workflows/validate-agents.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Find and validate agent files
        run: |
          exit_code=0
          for agent_file in $(find .claude/agents -name "*.md" -type f); do
            echo "Validating: $agent_file"
            if ! python agent_validator.py "$agent_file"; then
              exit_code=1
            fi
          done
          exit $exit_code
